name: release

# Push a v* tag (or run this workflow by hand against an existing tag) and one
# tag produces two jobs:
#
#   release      → the matching GitHub Release is created for that tag, using the
#                  repository's own built-in GITHUB_TOKEN — no PAT involved.
#   publish-npm  → the same tagged commit is published to npm, authenticated by
#                  OIDC trusted publishing: NO NPM_TOKEN secret exists anywhere.
#
# IMPORTANT — GitHub bootstrap rule: GitHub only dispatches tag events to a
# workflow file that ALREADY EXISTS ON THE DEFAULT BRANCH. A tag pushed before
# this file landed on main therefore never fires this run and stays tag-only
# (that is why v1.0.0 / v1.2.0 / v1.3.1 are tags without releases). For those,
# use Actions → release → Run workflow and type the tag name.
#
# IMPORTANT — npm bootstrap rule: a trusted publisher can only be configured on
# a package page that ALREADY EXISTS, so the very first version has to be
# published by hand once (`npm login && npm publish`) before publish-npm can
# succeed. On npmjs.com → the package → Settings → Trusted Publisher, add
# GitHub Actions with: owner `MrMu666`, repository `dsh-lan-tool`, workflow
# filename `release.yml` (filename only, no path), environment EMPTY, allowed
# action `npm publish`. Until that exists, publish-npm fails with an OIDC 404 —
# an expected error, not a broken YAML file.
#
# Note: publishing must hang off the tag push, NOT off `on: release: [published]`
# — GitHub never dispatches events that its own GITHUB_TOKEN created, and the
# release below is created with GITHUB_TOKEN.
#
# Also: if the repository has Actions disabled, the run will not even be queued
# (Settings → Actions → General → Allow all actions).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish a release for (e.g. v1.3.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Guard against a duplicate release
        id: guard
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release for $TAG already exists — nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        if: steps.guard.outputs.exists == 'false'
        run: |
          set -euo pipefail
          # Release notes come from the tagged range's commits, split into the
          # sections this project uses (Features / Fixes / Docs / Chore …) by the
          # repo's conventional-commit prefixes. `git tag --sort=-v:refname`
          # finds the previous version tag in reachable history.
          PREV="$(git tag --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"
          if [ -n "$PREV" ]; then
            # Dereference the annotated tag to its commit: `git log prev..cur` on
            # the tag NAME would also drop commits made before the annotated tag
            # object was written (docs/chore commits landed after the released
            # commit on the same history line).
            RANGE="$(git rev-list -n 1 "$PREV^{commit}")..$TAG"
          else
            RANGE="$TAG"
          fi
          echo "note range: $RANGE"

          {
            echo "## $TAG"
            echo
            if [ -n "$PREV" ]; then
              echo "从 [$PREV](https://github.com/$GITHUB_REPOSITORY/releases/tag/$PREV) 起的变更："
              echo
            fi
            for section in "feat:Features" "fix:Fixes" "docs:Docs" "perf:Performance" "refactor:Refactor" "release:Release" "chore:Chore" "test:Tests" "ci:CI" "build:Build"; do
              type="${section%%:*}"
              title="${section##*:}"
              body="$(git log --no-merges --pretty=format:'- %s' "$RANGE" --grep="^$type" 2>/dev/null || true)"
              if [ -n "$body" ]; then
                echo "### $title"
                echo "$body"
                echo
              fi
            done
            other="$(git log --no-merges --pretty=format:'- %s' "$RANGE" --invert-grep --grep='^feat' --grep='^fix' --grep='^docs' --grep='^perf' --grep='^refactor' --grep='^release' --grep='^chore' --grep='^test' --grep='^ci' --grep='^build' 2>/dev/null || true)"
            if [ -n "$other" ]; then
              echo "### Other"
              echo "$other"
              echo
            fi
            if [ -n "$PREV" ]; then
              echo "---"
              echo "对比：[\`$PREV...$TAG\`](https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG)"
            fi
          } > NOTES.md

          PRERELEASE_FLAG=""
          case "$TAG" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "$TAG" \
            --title "${TAG#v}" \
            --notes-file NOTES.md \
            --verify-tag \
            $PRERELEASE_FLAG

          echo "created: $(gh release view "$TAG" --json url --jq .url)"

  publish-npm:
    # Only a genuine tag push publishes to npm: a manual workflow_dispatch run is
    # the documented way to back-fill the GitHub Releases of the OLD tags
    # (v1.0.0 / v1.2.0 / v1.3.1 …), and those historical versions must never be
    # pushed onto the registry.
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token that npm's trusted publisher verifies
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up Node (trusted publishing needs npm >= 11.5.1 / Node >= 22.14)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Check the package identity against the tag
        id: pkg
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$NAME" != "dsh-lan-tool" ]; then
            echo "::error::package.json name is '$NAME', expected 'dsh-lan-tool' — refusing to publish"
            exit 1
          fi
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION — bump the version or move the tag"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip when the registry already has this version
        id: dup
        run: |
          set -euo pipefail
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on npm — nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show what the tarball will contain
        if: steps.dup.outputs.exists == 'false'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.dup.outputs.exists == 'false'
        run: |
          set -euo pipefail
          # npm publish authenticates by exchanging this job's OIDC token; there
          # is no NODE_AUTH_TOKEN here on purpose. Provenance is attached
          # automatically for a trusted publisher.
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease $TAG → 'next' dist-tag, so 'latest' keeps pointing at the newest stable version"
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
