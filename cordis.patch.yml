# dsh-lan-tool bundle patch.
#
# It deliberately contains NO `webserver` override. While LAN access is off the
# composition keeps the official row from @deepseek-ai/dsh-web-app untouched
# (`host: !!js ctx.webStartup.host ?? '127.0.0.1'` plus the gzip keys), so
# "off" is exactly the stock behaviour and gzip is never lost.
#
# Turning LAN access ON (Settings → General → 局域网访问) makes lib/index.js
# write a managed `webserver` override into the ACTIVE profile's own
# cordis.patch.yml — the profile patch layer is applied after every bundle
# layer, the harness watches that file, and the hot reload re-binds the socket.
# Turning it OFF removes that override again. One writer, one template: it
# restates host, port AND the three compression keys, because a patch replaces
# the targeted row's whole `config` block.
#
# npm package name, loader row name and the module's own `const name` must stay
# byte-identical: the loader resolves this row with `import()`, and the browser
# bundle URL is /plugins/<package name>/client.js.
- insert:
    - id: dsh-lan-tool
      name: 'dsh-lan-tool'
      config:
        # Fallback only: lib/index.js prefers profileContext.name (the profile
        # that is actually running) and profileContext.patchPath.
        profile: desktop
