<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSH 远程访问</title>
<style>
html,body{height:100%;margin:0}
body{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,12,16,.96);box-sizing:border-box}
.card{width:100%;max-width:380px;background:#171a21;border:1px solid #2a2f3a;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:12px;color:#e6e9ef;font:14px/1.55 -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;box-sizing:border-box}
.t{font-size:20px;font-weight:700;text-align:center}
.s{color:#9aa3b2;font-size:13px;text-align:center;margin-top:-6px}
input[type=password]{font:inherit;color:inherit;background:#0f1117;border:1px solid #2a2f3a;border-radius:10px;padding:11px 12px;outline:none}
input[type=password]:focus{border-color:#4c8dff}
label{display:flex;align-items:center;gap:8px;color:#9aa3b2;font-size:13px}
button{font:inherit;border:none;border-radius:10px;padding:11px;background:#4c8dff;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.err{color:#e5534b;font-size:13px;min-height:16px;text-align:center}
</style>
</head>
<body>
<div class="card">
<div class="t">DSH 远程访问</div>
<div class="s">输入访问口令后才能查看和使用本页面</div>
<input id="pw" type="password" placeholder="访问口令" autocomplete="current-password">
<label><input id="remember" type="checkbox"> 记住口令（仅保存在本机浏览器）</label>
<button id="go">进入</button>
<div class="err" id="err"></div>
</div>
<script>
(function () {
	var KEY_STORAGE = "dsh-lan-key";
	var COOKIE_NAME = "dsh-lan-key";
	function storedKey() {
		return window.localStorage.getItem(KEY_STORAGE) || window.sessionStorage.getItem(KEY_STORAGE) || "";
	}
	function setStoredKey(key, remember) {
		window.localStorage.removeItem(KEY_STORAGE);
		window.sessionStorage.removeItem(KEY_STORAGE);
		if (remember) window.localStorage.setItem(KEY_STORAGE, key);
		else window.sessionStorage.setItem(KEY_STORAGE, key);
		// Transport cookie for top-level navigations and WebSocket upgrades
		// (session-scoped; cleared when the browser closes or on lock).
		document.cookie = COOKIE_NAME + "=" + encodeURIComponent(key) + "; Path=/";
	}
	function postUnlock(password) {
		return window.fetch("/dsh-lan/unlock", {
			method: "POST",
			headers: { "content-type": "application/json" },
			body: JSON.stringify({ password: password })
		}).then(function (r) { return r.json().then(function (d) { return r.ok && d.ok === true; }); }).catch(function () { return false; });
	}
	function mint(password) {
		// Follow redirects (default): mint 302 -> token URL 303 (this hop
		// mints the DSH cookie) -> / 200. A final 2xx means the whole chain
		// completed. NOTE: redirect:"manual" must NOT be used here — an
		// unfollowed 302 never requests the token URL, so no DSH cookie is
		// ever minted and / would keep answering 401.
		return window.fetch("/dsh-lan/mint", {
			method: "POST",
			headers: { "content-type": "application/json" },
			body: JSON.stringify({ password: password })
		}).then(function (r) { return r.ok; }).catch(function () { return false; });
	}
	var input = document.getElementById("pw");
	var remember = document.getElementById("remember");
	var button = document.getElementById("go");
	var err = document.getElementById("err");
	// Bounce guard. A remembered key normally resumes silently: unlock → mint →
	// "/" → the GUI. When the browser drops the DSH session cookie (it is
	// HttpOnly + SameSite=Strict, so a cross-site iframe/WebView context cannot
	// keep it) "/" answers 302 back here and the silent resume would redirect
	// again — an endless flicker the user cannot type through. Count the hops
	// this tab has made and stop redirecting after MAX_HOPS, leaving a usable
	// form plus an explanation. This is an environment problem, not a wrong
	// password: the fix is to open the page in a real top-level tab.
	var HOPS_KEY = "dsh-lan-mint-hops";
	var MAX_HOPS = 2;
	function hops() {
		try { return parseInt(window.sessionStorage.getItem(HOPS_KEY) || "0", 10) || 0; } catch (e) { return 0; }
	}
	function setHops(value) {
		try { window.sessionStorage.setItem(HOPS_KEY, String(value)); } catch (e) {}
	}
	function land() {
		var next = hops() + 1;
		setHops(next);
		if (next > MAX_HOPS) {
			button.disabled = false;
			input.disabled = false;
			err.textContent = "登录未能完成：本浏览器没有保存登录凭据（Cookie 被阻止或被分区）。请在地址栏直接打开本页（不要用内嵌窗口 / iframe），再输入一次口令。";
			input.focus();
			return;
		}
		window.location.href = "/";
	}
	function attempt() {
		var value = input.value;
		if (!value) { err.textContent = "请输入口令"; return; }
		setHops(0); // a manual attempt gets a fresh redirect budget
		button.disabled = true;
		err.textContent = "";
		postUnlock(value).then(function (ok) {
			if (!ok) { err.textContent = "口令错误"; button.disabled = false; input.select(); return; }
			setStoredKey(value, remember.checked);
			return mint(value).then(function (minted) {
				if (minted) land();
				else { err.textContent = "登录失败，请重试"; button.disabled = false; }
			});
		});
	}
	button.addEventListener("click", attempt);
	input.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
	// This page is for LAN devices only. Two states need saying out loud:
	// - the host machine itself: no password is ever required (1.4.1), so send it
	//   straight into the GUI instead of showing a form it must not fill in;
	// - no password configured on the host: a LAN device cannot get in at all, so
	//   explain that rather than offering a form that cannot succeed.
	window.fetch("/dsh-lan/status", { cache: "no-store" }).then(function (r) {
		return r.ok ? r.json() : null;
	}).then(function (data) {
		if (!data) return;
		if (data.local === true) { land(); return; }
		if (data.passwordSet !== true) {
			document.querySelector(".s").textContent = "主机尚未设置访问口令，暂时无法从局域网进入。请在主机上打开「设置 → 局域网访问」设置口令后再试。";
			input.disabled = true;
			remember.disabled = true;
			button.disabled = true;
		}
	}).catch(function () {});
	// Silent resume: a remembered key skips the form entirely.
	var existing = storedKey();
	if (existing && hops() < MAX_HOPS) {
		button.disabled = true;
		postUnlock(existing).then(function (ok) {
			if (!ok) { button.disabled = false; return; }
			setStoredKey(existing, !!window.localStorage.getItem(KEY_STORAGE));
			mint(existing).then(function (minted) {
				if (minted) land();
				else button.disabled = false;
			});
		});
	} else {
		input.focus();
	}
})();
</script>
</body>
</html>
